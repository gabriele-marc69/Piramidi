<!doctype html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biondi Protocol v1.9 - spaccato</title>
<script src="https://cdn.tailwindcss.com"></script>
__PLOTLY__
<style>
  :root {
    --background: #09090b; --foreground: #fafafa;
    --card: #111114; --border: #27272a; --muted: #a1a1aa;
    --primary: #facc15; --ring: #facc15;
  }
  body { background: var(--background); color: var(--foreground); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: .75rem; }
  .tab[aria-selected="true"] { background: var(--primary); color: #2b2100; }
  .tab:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  input[type=number] { background: var(--background); border: 1px solid var(--border); border-radius: .375rem; padding: .25rem .4rem; width: 5.5rem; }
  input[type=range] { accent-color: var(--primary); height: 1.5rem; }
  #plan { cursor: crosshair; }
</style>
</head>
<body class="min-h-screen">
<main class="mx-auto max-w-7xl px-4 py-6">
  <header class="mb-4 flex flex-wrap items-baseline justify-between gap-2">
    <h1 class="text-2xl font-semibold tracking-tight" id="title"></h1>
    <a href="pyramids_bp19.html" class="text-sm underline" style="color:var(--primary)">Vista 3D</a>
  </header>

  <p id="loader" hidden class="mb-4 text-sm" style="color:#f87171"></p>

  <div role="tablist" aria-label="Piramide" class="mb-4 flex flex-wrap gap-2" id="tabs"></div>

  <section class="card p-4" aria-label="Spaccato verticale lungo una retta">
    <div class="flex flex-wrap gap-2" id="presets">
      <button type="button" data-p="ns" class="rounded-md border px-3 py-1.5 text-sm" style="border-color:var(--border)">Nord-Sud per le parti note</button>
      <button type="button" data-p="ew" class="rounded-md border px-3 py-1.5 text-sm" style="border-color:var(--border)">Est-Ovest per le parti note</button>
      <button type="button" data-p="d1" class="rounded-md border px-3 py-1.5 text-sm" style="border-color:var(--border)">Diagonale SO-NE</button>
      <button type="button" data-p="d2" class="rounded-md border px-3 py-1.5 text-sm" style="border-color:var(--border)">Diagonale NO-SE</button>
    </div>
    <form id="coords" class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm tabular-nums">
      <span>A: E <input id="aE" type="number" step="0.1" aria-label="A Est [m]"> N <input id="aN" type="number" step="0.1" aria-label="A Nord [m]"></span>
      <span>B: E <input id="bE" type="number" step="0.1" aria-label="B Est [m]"> N <input id="bN" type="number" step="0.1" aria-label="B Nord [m]"></span>
      <label class="flex items-center gap-1"><input id="snap" type="checkbox" class="h-4 w-4"> aggancia al centro delle colonne</label>
      <button type="button" id="swap" class="rounded-md border px-3 py-1 text-sm" style="border-color:var(--border)">Inverti A-B</button>
      <button type="button" id="extend" class="rounded-md border px-3 py-1 text-sm" style="border-color:var(--border)">Estendi ai bordi della base</button>
    </form>
    <div class="mt-3 grid max-w-2xl gap-x-6 gap-y-1 sm:grid-cols-2 text-sm">
      <div>
        <label for="smin" class="flex items-baseline justify-between font-medium"><span>Scala R&sup2; minimo</span>
          <output id="sminOut" class="tabular-nums" style="color:var(--primary)"></output></label>
        <input id="smin" type="range" min="0" max="1000" step="1" value="0" class="w-full">
      </div>
      <div>
        <label for="smax" class="flex items-baseline justify-between font-medium"><span>Scala R&sup2; massimo</span>
          <output id="smaxOut" class="tabular-nums" style="color:var(--primary)"></output></label>
        <input id="smax" type="range" min="0" max="1000" step="1" value="1000" class="w-full">
      </div>
    </div>
    <p id="lineInfo" class="mt-2 text-sm tabular-nums" aria-live="polite"></p>
    <div class="mt-2 grid gap-4 lg:grid-cols-[440px_1fr]">
      <div id="plan" style="width:100%; height:440px"></div>
      <div id="sect" style="width:100%; height:560px"></div>
    </div>
  </section>
</main>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
let D;

async function loadData() {
  const one = f => new Promise((res, rej) => {
    window.bp19_dati = res;
    const s = document.createElement("script");
    s.src = f; s.onload = () => s.remove(); s.onerror = () => { s.remove(); rej(f); };
    document.head.appendChild(s);
  }).catch(() => fetch(f).then(r => { if (!r.ok) throw f; return r.text(); })
    .then(t => JSON.parse(t.slice(t.indexOf("(") + 1, t.lastIndexOf(")")))));
  const idx = await one(DATA);
  for (const f of idx.files) {
    for (const q of (await one(f)).parts) {
      const p = idx.pyramids[q.p];
      ((p._chunks = p._chunks || {})[q.f] = p._chunks[q.f] || [])[q.k] = q.s;
    }
  }
  for (const p of idx.pyramids) { for (const f in p._chunks) p[f] = p._chunks[f].join(""); delete p._chunks; }
  return idx;
}

function b64ToU8(b) {
  const s = atob(b), a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function init() {
  document.title = D.title + " - spaccato";
  $("title").textContent = D.title + " - spaccato verticale";
  for (const p of D.pyramids) {
    const idx = new Uint32Array(b64ToU8(p.vox_idx_b64).buffer), val = new Uint16Array(b64ToU8(p.vox_val_b64).buffer);
    const dep = new Uint16Array(b64ToU8(p.vox_dep_b64).buffer);
    p.vox = new Uint16Array(p.n_col * p.n_col * p.nz); p.dep = new Uint16Array(p.vox.length);
    for (let i = 0; i < idx.length; i++) { p.vox[idx[i]] = val[i]; p.dep[idx[i]] = dep[i]; }
    delete p.vox_idx_b64; delete p.vox_val_b64; delete p.vox_dep_b64; delete p.png_b64;
  }
  D.pyramids.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.role = "tab"; b.className = "tab rounded-md border px-3 py-1.5 text-sm font-medium";
    b.style.borderColor = "var(--border)"; b.textContent = p.label;
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.addEventListener("click", () => { cur = i; for (const t of tabs.children) t.setAttribute("aria-selected", "false"); b.setAttribute("aria-selected", "true"); setPreset("ns"); redraw(true); });
    tabs.appendChild(b);
  });
}

const SCALE = [[0,"#000000"],[0.15,"#4d4000"],[0.4,"#a68a00"],[0.7,"#e6c700"],[1,"#ffff00"]];
const fmt = (v, d) => v.toFixed(d).replace(".", ",");

let cur = 0;
const tabs = $("tabs");

let line = null, pick = null;
const DARK = { paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "#000000", font: { color: "#a1a1aa" } };
const axs = t => ({ title: { text: t }, color: "#a1a1aa", gridcolor: "#27272a", zerolinecolor: "#3f3f46" });
const r1 = v => Number(v.toFixed(1));

function scale() {
  let a = parseInt($("smin").value), b = parseInt($("smax").value);
  if (a >= b) { if (this === $("smin")) a = b - 1; else b = a + 1; }
  if (a < 0) { a = 0; b = Math.max(b, 1); }
  if (b > 1000) { b = 1000; a = Math.min(a, 999); }
  $("smin").value = a; $("smax").value = b;
  $("sminOut").textContent = fmt(a / 1000, 3); $("smaxOut").textContent = fmt(b / 1000, 3);
  return [a / 1000, b / 1000];
}
function colOf(p, x, y) {
  const i = Math.round((x + p.side / 2) / p.cs), j = Math.round((y + p.side / 2) / p.cs);
  return (i < 0 || j < 0 || i >= p.n_col || j >= p.n_col) ? -1 : i * p.n_col + j;
}
function capOf(p, c) {
  const half = p.side / 2, ex = -half + Math.floor(c / p.n_col) * p.cs, ny = -half + (c % p.n_col) * p.cs;
  return p.H * (1 - Math.max(Math.abs(ex), Math.abs(ny)) / half);
}
function colMax(p) {
  if (p.cmax) return p.cmax;
  const n = p.n_col, m = new Float32Array(n * n), d = new Float32Array(n * n);
  for (let c = 0; c < n * n; c++) {
    let v = 0, k = -1; const o = c * p.nz;
    for (let i = 0; i < p.nz; i++) if (p.vox[o + i] > v) { v = p.vox[o + i]; k = o + i; }
    m[c] = v / 65535; d[c] = k >= 0 ? p.z0 + p.dep[k] * p.dz : NaN;
  }
  p.cdep = d;
  return (p.cmax = m);
}
function setPreset(k) {
  const p = D.pyramids[cur], h = p.side / 2;
  const kx = p.known.length ? p.known.map(s => s.c ? s.c[0] : 0).sort((a, b) => a - b)[Math.floor(p.known.length / 2)] : 0;
  const ky = p.known.length ? p.known.map(s => s.c ? s.c[1] : 0).sort((a, b) => a - b)[Math.floor(p.known.length / 2)] : 0;
  line = { ns: { a: [kx, -h], b: [kx, h] }, ew: { a: [-h, ky], b: [h, ky] },
           d1: { a: [-h, -h], b: [h, h] }, d2: { a: [-h, h], b: [h, -h] } }[k];
  pick = null;
}
function snapXY(x, y) {
  const p = D.pyramids[cur], h = p.side / 2;
  if (!$("snap").checked) return [r1(x), r1(y)];
  const g = v => r1(-h + Math.min(p.n_col - 1, Math.max(0, Math.round((v + h) / p.cs))) * p.cs);
  return [g(x), g(y)];
}
function extendLine() {
  if (!line) return;
  const h = D.pyramids[cur].side / 2, [ax, ay] = line.a, dx = line.b[0] - ax, dy = line.b[1] - ay;
  if (Math.hypot(dx, dy) < 1e-6) return;
  let t0 = -Infinity, t1 = Infinity;
  for (const [d, o] of [[dx, ax], [dy, ay]]) {
    if (Math.abs(d) < 1e-12) { if (Math.abs(o) > h) return; continue; }
    const ta = (-h - o) / d, tb = (h - o) / d;
    t0 = Math.max(t0, Math.min(ta, tb)); t1 = Math.min(t1, Math.max(ta, tb));
  }
  if (t0 >= t1) return;
  line = { a: [r1(ax + dx * t0), r1(ay + dy * t0)], b: [r1(ax + dx * t1), r1(ay + dy * t1)] };
}
let typing = false;
function showCoords() {
  if (typing) return;
  const a = line ? line.a : pick, b = line ? line.b : null;
  $("aE").value = a ? r1(a[0]) : ""; $("aN").value = a ? r1(a[1]) : "";
  $("bE").value = b ? r1(b[0]) : ""; $("bN").value = b ? r1(b[1]) : "";
}

function planShapes() {
  return line ? [{ type: "line", xref: "x", yref: "y", x0: line.a[0], y0: line.a[1], x1: line.b[0], y1: line.b[1],
                   line: { color: "#fafafa", width: 2 } }] : [];
}
function drawPlan() {
  const p = D.pyramids[cur], n = p.n_col, h = p.side / 2, m = colMax(p), [zmin, zmax] = scale.call(null);
  const ax = Array.from({ length: n }, (_, i) => -h + i * p.cs);
  const z = Array.from({ length: n }, (_, j) => Array.from({ length: n }, (_, i) => m[i * n + j]));
  const cd = Array.from({ length: n }, (_, j) => Array.from({ length: n }, (_, i) => p.cdep[i * n + j]));
  const tr = [{ type: "heatmap", x: ax, y: ax, z, customdata: cd, colorscale: SCALE, zmin, zmax, showscale: false,
                hovertemplate: "E %{x:.1f} m<br>N %{y:.1f} m<br>R² max %{z:.4f}<br>profondita' %{customdata:.2f} m<extra></extra>" },
              { type: "scatter", mode: "lines", x: [-h, h, h, -h, -h, null, -h, h, null, -h, h],
                y: [-h, -h, h, h, -h, null, -h, h, null, h, -h], line: { color: "#a1a1aa", width: 1 }, hoverinfo: "skip" }];
  for (const s of p.known) {
    const x = [], y = [];
    for (let i = 0; i + 5 < s.seg.length; i += 6) { x.push(s.seg[i], s.seg[i + 3], null); y.push(s.seg[i + 1], s.seg[i + 4], null); }
    tr.push({ type: "scatter", mode: "lines", x, y, line: { color: s.color || "#4ade80", width: 2 }, hoverinfo: "skip" });
  }
  const pts = line ? [line.a, line.b] : pick ? [pick] : [];
  tr.push({ type: "scatter", mode: "markers+text", x: pts.map(q => q[0]), y: pts.map(q => q[1]), text: ["A", "B"].slice(0, pts.length),
            textposition: "top center", textfont: { color: "#fafafa" }, marker: { color: "#fafafa", size: 8 }, hoverinfo: "skip" });
  tr.push({ type: "scatter", mode: "lines", x: [], y: [], line: { color: "#fafafa", width: 1, dash: "dot" }, hoverinfo: "skip" });
  const gd = $("plan"), old = gd.layout && gd.layout.xaxis && gd._keepRange;
  Plotly.react("plan", tr, Object.assign({}, DARK, { margin: { l: 45, r: 10, t: 10, b: 40 }, showlegend: false, dragmode: "pan",
    shapes: planShapes(),
    xaxis: Object.assign(axs("Est [m]"), { range: old ? gd.layout.xaxis.range.slice() : [-h - 2, h + 2] }),
    yaxis: Object.assign(axs("Nord [m]"), { range: old ? gd.layout.yaxis.range.slice() : [-h - 2, h + 2], scaleanchor: "x" }) }),
    { displaylogo: false, responsive: true, scrollZoom: true, edits: { shapePosition: true } });
  gd._keepRange = true;
  showCoords();
  if (gd._clickSet) return;
  gd._clickSet = true;
  const toData = ev => {
    const fl = gd._fullLayout, xa = fl.xaxis, ya = fl.yaxis, r = gd.getBoundingClientRect();
    const px = ev.clientX - r.left - xa._offset, py = ev.clientY - r.top - ya._offset;
    if (px < 0 || py < 0 || px > xa._length || py > ya._length) return null;
    return [xa.p2l(px), ya.p2l(py)];
  };
  let down = null;
  gd.addEventListener("pointerdown", ev => { down = ev.button === 0 ? [ev.clientX, ev.clientY, toData(ev)] : null; }, true);
  document.addEventListener("pointerup", ev => {
    if (!down || !down[2] || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 4) { down = null; return; }
    const xy = snapXY(down[2][0], down[2][1]); down = null;
    if (!pick) { pick = xy; line = null; } else { line = { a: pick, b: xy }; pick = null; }
    drawPlan(); drawSection();
  }, true);
  gd.addEventListener("pointermove", ev => {
    if (!pick) return;
    const q = toData(ev);
    if (q) Plotly.restyle(gd, { x: [[pick[0], q[0]]], y: [[pick[1], q[1]]] }, [gd.data.length - 1]);
  });
  gd.on("plotly_relayout", ev => {
    if (!line || !Object.keys(ev).some(k => k.startsWith("shapes[0]"))) return;
    const s = gd.layout.shapes[0];
    line = { a: snapXY(s.x0, s.y0), b: snapXY(s.x1, s.y1) };
    drawPlan(); drawSection();
  });
}

function drawSection() {
  const p = D.pyramids[cur], [zmin, zmax] = scale.call(null);
  if (!line) {
    $("lineInfo").textContent = pick ? "A = E " + pick[0] + ", N " + pick[1] + " m" : "";
    Plotly.purge("sect"); return;
  }
  const [ax, ay] = line.a, [bx, by] = line.b, L = Math.hypot(bx - ax, by - ay);
  if (L < p.cs) { $("lineInfo").textContent = "Retta di " + fmt(L, 1) + " m, meno di un cubo (" + fmt(p.cs, 2) + " m)"; Plotly.purge("sect"); return; }
  const ux = (bx - ax) / L, uy = (by - ay) / L, ns = Math.ceil(L / p.cs) + 1;
  const zlo = Math.min(p.zb, p.zmax || p.zb), nzz = Math.ceil((p.H + zlo) / p.cs), S = [], Zc = [];
  for (let k = 0; k < ns; k++) S.push(k * L / (ns - 1));
  for (let m = 0; m < nzz; m++) Zc.push(p.H - (m + 0.5) * p.cs);
  const V = Zc.map(() => new Array(ns).fill(null)), Dm = Zc.map(() => new Array(ns).fill(null)), surf = [];
  let sum = 0, cnt = 0;
  for (let k = 0; k < ns; k++) {
    const c = colOf(p, ax + ux * S[k], ay + uy * S[k]);
    if (c < 0) { surf.push(null); continue; }
    const cap = capOf(p, c); surf.push(cap);
    for (let m = 0; m < nzz; m++) {
      const zc = Zc[m];
      if (zc > cap || zc < -zlo || cap - zc > p.zmax) continue;
      const i = Math.floor((cap - zc) / p.cs);
      if (i >= p.nz) continue;
      const o = c * p.nz + i;
      V[m][k] = p.vox[o] / 65535; sum += V[m][k]; cnt++;
      if (p.vox[o]) Dm[m][k] = p.z0 + p.dep[o] * p.dz;
    }
  }
  const tr = [{ type: "heatmap", x: S, y: Zc, z: V, customdata: Dm, colorscale: SCALE, zmin, zmax,
                colorbar: { title: { text: "R² corretto" }, thickness: 12, tickfont: { color: "#a1a1aa" } },
                hovertemplate: "distanza da A %{x:.1f} m<br>z %{y:.1f} m<br>R² %{z:.4f}<br>profondita' del massimo %{customdata:.2f} m<extra></extra>" },
              { type: "scatter", mode: "lines", x: S, y: surf, line: { color: "#a1a1aa", width: 2 }, name: "superficie", hoverinfo: "skip" },
              { type: "scatter", mode: "lines", x: [0, L], y: [0, 0], line: { color: "#a1a1aa", width: 1, dash: "dash" }, name: "base", hoverinfo: "skip" }];
  for (const s of p.known) {
    const x = [], y = [], tol = p.cs / 2 + s.inc;
    for (let i = 0; i + 5 < s.seg.length; i += 6) {
      const d = Math.hypot(s.seg[i + 3] - s.seg[i], s.seg[i + 4] - s.seg[i + 1], s.seg[i + 5] - s.seg[i + 2]);
      const n = Math.max(1, Math.ceil(d / 0.25));
      for (let t = 0; t <= n; t++) {
        const px = s.seg[i] + (s.seg[i + 3] - s.seg[i]) * t / n, py = s.seg[i + 1] + (s.seg[i + 4] - s.seg[i + 1]) * t / n;
        const pz = s.seg[i + 2] + (s.seg[i + 5] - s.seg[i + 2]) * t / n;
        const al = (px - ax) * ux + (py - ay) * uy, perp = Math.abs(-(px - ax) * uy + (py - ay) * ux);
        if (al >= 0 && al <= L && perp <= tol) { x.push(al); y.push(pz); }
      }
    }
    if (x.length) tr.push({ type: "scatter", mode: "markers", x, y, name: s.n + ". " + s.name,
                            marker: { color: s.color || "#4ade80", size: 3 }, hovertemplate: s.n + ". " + s.name + "<extra></extra>" });
  }
  const az = ((Math.atan2(ux, uy) * 180 / Math.PI) + 360) % 360;
  $("lineInfo").textContent = "A = E " + ax.toFixed(1) + ", N " + ay.toFixed(1) + " m  ->  B = E " + bx.toFixed(1) + ", N " +
    by.toFixed(1) + " m; lunghezza " + L.toFixed(1) + " m; azimut " + az.toFixed(1) + "°; R² medio " + (cnt ? (sum / cnt).toFixed(4) : "-");
  Plotly.react("sect", tr, Object.assign({}, DARK, { margin: { l: 55, r: 10, t: 10, b: 45 }, showlegend: false,
    xaxis: Object.assign(axs("distanza da A [m]"), { range: [0, L] }),
    yaxis: Object.assign(axs("quota z [m]"), { range: [-zlo, p.H + 3] }) }), { displaylogo: false, responsive: true });
}

function redraw(newPyr) {
  if (newPyr) $("plan")._keepRange = false;
  drawPlan(); drawSection();
}
function restyleScale() {
  const [zmin, zmax] = scale.call(this);
  Plotly.restyle("plan", { zmin, zmax }, [0]);
  if ($("sect").data) Plotly.restyle("sect", { zmin, zmax }, [0]);
}
for (const b of $("presets").children) b.addEventListener("click", () => { setPreset(b.dataset.p); redraw(false); });
$("coords").addEventListener("change", () => {
  const v = ["aE", "aN", "bE", "bN"].map(id => parseFloat($(id).value));
  if (v.slice(0, 2).some(isNaN)) return;
  if (v.slice(2).some(isNaN)) { pick = [v[0], v[1]]; line = null; }
  else { line = { a: [v[0], v[1]], b: [v[2], v[3]] }; pick = null; }
  typing = true; redraw(false); typing = false;
});
$("coords").addEventListener("submit", ev => ev.preventDefault());
$("swap").addEventListener("click", () => { if (line) { line = { a: line.b, b: line.a }; redraw(false); } });
$("extend").addEventListener("click", () => { extendLine(); redraw(false); });
for (const id of ["smin", "smax"]) { $(id).addEventListener("input", function () { scale.call(this); }); $(id).addEventListener("change", restyleScale); }
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && pick) { pick = null; redraw(false); } });
loadData().catch(f => { $("loader").textContent = "File dei dati non trovato: " + f; $("loader").hidden = false; throw f; })
  .then(d => { D = d; init(); setPreset("ns"); redraw(true); });
</script>
</body>
</html>
